<section id="viz-mechanism" data-toc="Визуализация вылета">
  <h2><span class="htext">Визуализация вылета</span>
      <a class="anchor" href="#viz-mechanism">#</a></h2>
  <p>Обе сборки доходят до одного поля ключа обычного узла размером
     0x10 байт. В R40 адрес поля вычислен точно: ESI+8=EAX.</p>
  <div class="card">
    <svg viewBox="0 0 920 330" role="img"
         aria-label="Схема чтения нулевого ключа узла в R39 и R40"
         style="display:block;width:100%;height:auto;max-width:920px;margin:auto">
      <defs>
        <marker id="viz-arrow" markerWidth="10" markerHeight="10"
                refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/>
        </marker>
      </defs>
      <text x="30" y="34" font-size="20" font-weight="700">Узел R40: ESI = 0x052EF5B8</text>
      <rect x="30" y="58" width="170" height="72" rx="10"
            fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
      <text x="48" y="88" font-size="16">+0h..+7h</text>
      <text x="48" y="112" font-size="15">служебные поля</text>
      <rect x="200" y="58" width="210" height="72" rx="10"
            fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2"/>
      <text x="220" y="88" font-size="16" font-weight="700">+8h: строковый ключ</text>
      <text x="220" y="113" font-size="15">[0x052EF5C0] = 0</text>
      <rect x="410" y="58" width="155" height="72" rx="10"
            fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
      <text x="422" y="88" font-size="16">+Ch</text>
      <text x="422" y="112" font-size="15">служебное поле</text>
      <line x1="305" y1="135" x2="305" y2="180" stroke="currentColor"
            stroke-width="2" marker-end="url(#viz-arrow)"/>
      <text x="185" y="210" font-size="16">0x01044EE8: ECX = [EAX] = 0</text>
      <line x1="410" y1="205" x2="565" y2="205" stroke="currentColor"
            stroke-width="2" marker-end="url(#viz-arrow)"/>
      <rect x="575" y="166" width="315" height="78" rx="12"
            fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="2"/>
      <text x="598" y="197" font-size="17" font-weight="700">0x01044EED: mov al,[ecx]</text>
      <text x="598" y="224" font-size="16">чтение по 0x00000000 — вылет</text>
      <text x="30" y="285" font-size="17" font-weight="700">Межверсионный контроль</text>
      <text x="30" y="314" font-size="15">R39: [ESI+8] -&gt; EDI=0 -&gt; mov bl,[edi] · R40: &amp;[ESI+8] -&gt; ECX=0 -&gt; mov al,[ecx]</text>
    </svg>
  </div>
  <p>Схема показывает доказанный локальный механизм. Она не устанавливает,
     какая операция первой записала нуль или повредила связи списка.</p>
</section>
